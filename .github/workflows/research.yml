name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch arXiv Papers
        run: |
          mkdir -p reports
          DATE=$(date +'%Y-%m-%d')
          echo "TODAY=$DATE" >> $GITHUB_ENV
          curl "https://export.arxiv.org/api/query?search_query=cat:cs.AI+AND+cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=20" > /tmp/arxiv_raw.xml

      - name: Generate Research Briefing
        run: |
          ARXIV_CONTENT=$(cat /tmp/arxiv_raw.xml)
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "{
              \"model\": \"claude-haiku-4-5-20251001\",
              \"max_tokens\": 4096,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": \"Today is ${{ env.TODAY }}. Here are today's arXiv papers in XML format:\n\n$ARXIV_CONTENT\n\nFilter and summarize papers relevant to AI safety, interpretability, and governance. For each relevant paper provide: Title & Link, The So What (2 sentences on why this matters), and Technical Core (brief abstract summary). Format as markdown.\"
              }]
            }")
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(data['content'][0]['text'])
          " > reports/daily-briefing-${{ env.TODAY }}.md

      - name: Automatic Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vagarwal89/ai-safety-research.git
          git add reports/
          git diff --staged --quiet || git commit -m "Add daily research report $(date +'%Y-%m-%d')"
          git push origin main
