name: AI Safety Research Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests anthropic

      - name: Set Today's Date
        run: echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Fetch arXiv Papers
        run: |
          python3 << 'EOF'
          import requests
          import os

          os.makedirs('reports', exist_ok=True)

          # Fetch latest cs.AI and cs.LG papers as XML
          import requests
          import os
          import json
          from datetime import datetime, timedelta
          
          os.makedirs('reports', exist_ok=True)
          week_ago = (datetime.now() - timedelta(days=7)).strftime('%Y-%m-%d')
          
          sources = {}
          
          # 1. arXiv — already working
          arxiv_params = {
              "search_query": "cat:cs.AI OR cat:cs.LG",
              "start": 0, "max_results": 50,
              "sortBy": "submittedDate", "sortOrder": "descending"
          }
          r = requests.get("http://export.arxiv.org/api/query", params=arxiv_params)
          sources['arxiv'] = r.text
          
          # 2. Anthropic RSS
          r = requests.get("https://www.anthropic.com/rss.xml", timeout=10)
          sources['anthropic'] = r.text
          
          # 3. Alignment Forum (has a public GraphQL API)
          af_query = """
          {
            posts(input: {terms: {view: "new", limit: 20, after: "%s"}}) {
              results { title url postedAt score excerpt }
            }
          }
          """ % week_ago
          r = requests.post(
              "https://www.alignmentforum.org/graphql",
              json={"query": af_query},
              headers={"Content-Type": "application/json"},
              timeout=15
          )
          sources['alignment_forum'] = r.text
          
          # 4. LessWrong (same API structure as AF)
          r = requests.post(
              "https://lesswrong.com/graphql",
              json={"query": af_query},
              headers={"Content-Type": "application/json"},
              timeout=15
          )
          sources['lesswrong'] = r.text
          
          # 5. GovAI blog RSS
          r = requests.get("https://www.governance.ai/feed", timeout=10)
          sources['govai'] = r.text
          
          # 6. Future of Life Institute
          r = requests.get("https://futureoflife.org/feed/", timeout=10)
          sources['fli'] = r.text
          
          # Save all sources to a single file
          with open('reports/weekly_raw.json', 'w') as f:
              json.dump(sources, f)
          
          print(f"Fetched {len(sources)} sources")

      - name: Generate Daily Briefing
        run: |
          python3 << 'EOF'
          import anthropic
          import os

          date = os.environ['TODAY']

          # Read the protocol from claude.md
          with open('CLAUDE.md', 'r') as f:
              protocol = f.read()

          # Read today's raw arXiv XML
          with open('reports/arxiv_raw.xml', 'r', encoding='utf-8') as f:
              arxiv_xml = f.read()

          output_path = f"reports/daily-briefing-{date}.md"

          prompt = f"""{protocol}

          Today's date is {date}.
          The output file path is: {output_path}

          Below is the content of reports/arxiv_raw.xml for today:

          {arxiv_xml}

          Following the protocol above exactly, produce the markdown briefing now.
          Write only the markdown content — no preamble, no commentary.
          """

          client = anthropic.Anthropic(api_key=os.environ['ANTHROPIC_API_KEY'])

          message = client.messages.create(
              model="claude-opus-4-5",
              max_tokens=3000,
              messages=[{"role": "user", "content": prompt}]
          )

          digest_content = message.content[0].text

          os.makedirs('reports', exist_ok=True)
          with open(output_path, 'w') as f:
              f.write(digest_content)

          print(f"Briefing written to {output_path}")
          print(f"Word count: {len(digest_content.split())}")
          EOF
        env:
          TODAY: ${{ env.TODAY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Debug - Confirm Report Exists
        run: |
          echo "Looking for: reports/daily-briefing-$TODAY.md"
          ls -la reports/
          echo "--- Preview (first 20 lines) ---"
          head -20 reports/daily-briefing-$TODAY.md
        env:
          TODAY: ${{ env.TODAY }}

      - name: Send Email Digest
        run: |
          python3 << 'EOF'
          import smtplib
          import os
          import re
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          date = os.environ['TODAY']
          gmail = os.environ['GMAIL_ADDRESS']
          password = os.environ['GMAIL_APP_PASSWORD']

          with open(f"reports/daily-briefing-{date}.md", 'r') as f:
              content = f.read()

          # Convert markdown to clean HTML
          html_lines = []
          for line in content.split('\n'):
              if line.startswith('# '):
                  html_lines.append(f'<h2 style="color:#1a1a1a;font-size:20px;margin-bottom:4px;">{line[2:]}</h2>')
              elif line.startswith('## '):
                  html_lines.append(f'<h3 style="color:#333;font-size:16px;margin-bottom:4px;">{line[3:]}</h3>')
              elif line.startswith('### '):
                  html_lines.append(f'<h4 style="color:#444;font-size:14px;margin-bottom:2px;">{line[4:]}</h4>')
              elif line.startswith('---'):
                  html_lines.append('<hr style="border:none;border-top:1px solid #eee;margin:16px 0;">')
              elif line.startswith('- **'):
                  line = re.sub(r'\*\*(.*?)\*\*', r'<strong>\1</strong>', line)
                  html_lines.append(f'<p style="margin:4px 0;font-size:13px;color:#333;">{line[2:]}</p>')
              elif line.strip() == '':
                  html_lines.append('<br>')
              else:
                  line = re.sub(r'\*\*(.*?)\*\*', r'<strong>\1</strong>', line)
                  line = re.sub(r'\[(.*?)\]\((.*?)\)', r'<a href="\2" style="color:#0066cc;">\1</a>', line)
                  html_lines.append(f'<p style="margin:4px 0;font-size:13px;color:#333;line-height:1.5;">{line}</p>')

          html_body = '\n'.join(html_lines)

          html = f"""
          <html>
          <body style="font-family:Arial,sans-serif;max-width:680px;margin:0 auto;padding:24px;background:#f9f9f9;">
            <div style="background:#fff;border-radius:8px;padding:24px;border:1px solid #e0e0e0;">
              <div style="border-bottom:2px solid #0066cc;padding-bottom:12px;margin-bottom:20px;">
                <p style="font-size:11px;color:#888;margin:0;">AI SAFETY RESEARCH DIGEST</p>
                <p style="font-size:13px;color:#555;margin:4px 0 0 0;">{date}</p>
              </div>
              {html_body}
              <div style="margin-top:24px;padding-top:12px;border-top:1px solid #eee;">
                <p style="font-size:11px;color:#aaa;margin:0;">Generated from arXiv cs.AI + cs.LG · vagarwal89/ai-safety-research</p>
              </div>
            </div>
          </body>
          </html>
          """

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"AI Safety Digest — {date}"
          msg['From'] = gmail
          msg['To'] = gmail
          msg.attach(MIMEText(content, 'plain'))
          msg.attach(MIMEText(html, 'html'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail, password)
              server.sendmail(gmail, gmail, msg.as_string())

          print("Email sent successfully")
          EOF
        env:
          TODAY: ${{ env.TODAY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit Reports to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Daily briefing for $TODAY"
          git push
        env:
          TODAY: ${{ env.TODAY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
