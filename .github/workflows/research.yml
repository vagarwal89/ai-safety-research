name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch arXiv Papers
        run: |
          mkdir -p reports
          DATE=$(date +'%Y-%m-%d')
          echo "TODAY=$DATE" >> $GITHUB_ENV
          curl "https://export.arxiv.org/api/query?search_query=cat:cs.AI+AND+cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=20" > /tmp/arxiv_raw.xml

      - name: Generate Research Briefing
        run: |
          python3 << 'EOF'
          import json
          import urllib.request
          import os

          with open('/tmp/arxiv_raw.xml', 'r') as f:
              arxiv_content = f.read()

          date = os.environ['TODAY']

          payload = {
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 4096,
              "messages": [{
                  "role": "user",
                  "content": f"Today is {date}. Here are today's arXiv papers in XML format:\n\n{arxiv_content}\n\nFilter and summarize papers relevant to AI safety, interpretability, and governance. For each relevant paper provide:\n- Title & Link\n- The So What: 2 sentences on why this matters for safety/governance\n- Technical Core: brief abstract summary\n\nFormat as markdown. If no relevant papers found, write 'No critical updates today.'"
              }]
          }

          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages',
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json'
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read())

          output = data['content'][0]['text']

          with open(f"reports/daily-briefing-{date}.md", 'w') as f:
              f.write(f"# Daily AI Safety Research Briefing\n**Date:** {date}\n\n")
              f.write(output)

          print("Briefing written successfully")
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TODAY: ${{ env.TODAY }}

      - name: Send Email Digest
        run: |
          python3 << 'EOF'
          import smtplib
          import os
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          date = os.environ['TODAY']
          gmail = os.environ['GMAIL_ADDRESS']
          password = os.environ['GMAIL_APP_PASSWORD']

          with open(f"reports/daily-briefing-{date}.md", 'r') as f:
              content = f.read()

          # Convert markdown to simple HTML
          html = content \
              .replace('# ', '<h1>').replace('\n', '<br>\n') \
              .replace('### ', '<h3>').replace('## ', '<h2>') \
              .replace('**', '<b>').replace('</b><b>', '') \
              .replace('---', '<hr>')

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"AI Safety Research Digest - {date}"
          msg['From'] = gmail
          msg['To'] = gmail

          msg.attach(MIMEText(content, 'plain'))
          msg.attach(MIMEText(f"<html><body>{html}</body></html>", 'html'))

          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login(gmail, password)
              server.sendmail(gmail, gmail, msg.as_string())

          print("Email sent successfully")
          EOF
        env:
          TODAY: ${{ env.TODAY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Automatic Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vagarwal89/ai-safety-research.git
          git add reports/
          git diff --staged --quiet || git commit -m "Add daily research report $(date +'%Y-%m-%d')"
          git push origin main
