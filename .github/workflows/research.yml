name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Workspace
        run: |
          mkdir -p reports
          touch reports/latest_research.md

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5"
          prompt: "Read CLAUDE.md. Write the research summary directly into 'reports/latest_research.md'."

      - name: Automatic Save
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "Add daily research report"
          file_pattern: 'reports/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # <--- ADD THIS LINE
