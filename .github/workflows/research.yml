name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Workspace
        run: |
          mkdir -p reports
          DATE=$(date +'%Y-%m-%d')
          echo $DATE > reports/date.txt
          touch reports/daily-briefing-$DATE.md
          echo "TARGET_FILE=reports/daily-briefing-$DATE.md" >> $GITHUB_ENV

      - name: Fetch arXiv Papers
        run: |
          curl "https://export.arxiv.org/api/query?search_query=cat:cs.AI+AND+cat:cs.LG&sortBy=submittedDate&sortOrder=descending&max_results=20" > reports/arxiv_raw.xml

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5"
          show_full_output: true
          allowed_tools: "computer,bash,editor,write_file,str_replace_editor,str_replace_based_edit_tool"
          prompt: |
            Read CLAUDE.md for instructions.
            Read reports/date.txt to get today's date.
            Read reports/arxiv_raw.xml which contains today's latest arXiv papers in XML format.
            Filter and summarize the papers per CLAUDE.md instructions.
            Write your output into this exact file path: ${{ env.TARGET_FILE }}
            That file already exists — just write the research content into it.
            Do not leave the file empty under any circumstances.

      - name: Automatic Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vagarwal89/ai-safety-research.git
          git add reports/
          git diff --staged --quiet || git commit -m "Add daily research report $(date +'%Y-%m-%d')"
          git push origin main
