name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare Workspace
        run: |
          mkdir -p reports
          echo "Today's date is $(date +'%Y-%m-%d')" > reports/date.txt

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5"
          prompt: |
            Read CLAUDE.md for instructions.
            Read reports/date.txt to get today's date.
            You do not have internet access, so you cannot query arXiv directly.
            Instead, write a research briefing based on your training knowledge about
            recent developments in AI safety, interpretability, and governance from
            the researchers and organizations listed in CLAUDE.md.
            Save the output to 'reports/daily-briefing-YYYY-MM-DD.md' replacing
            YYYY-MM-DD with today's actual date from reports/date.txt.
            Do not leave the file empty under any circumstances.

      - name: Automatic Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vagarwal89/ai-safety-research.git
          git add reports/
          git diff --staged --quiet || git commit -m "Add daily research report $(date +'%Y-%m-%d')"
          git push origin main
