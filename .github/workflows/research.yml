name: Send Daily Digest

on:
  workflow_dispatch:  # This lets you run it manually
  schedule:
    - cron: '0 9 * * *' # Runs every day at 9 AM UTC

jobs:
  email-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Send Email Digest
        env:
          TODAY: ${{ env.TODAY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'EOF'
          import smtplib
          import os
          import re
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          date = os.environ.get('TODAY', '2026-03-26')
          gmail = os.environ.get('GMAIL_ADDRESS')
          password = os.environ.get('GMAIL_APP_PASSWORD')

          try:
              with open(f"reports/daily-briefing-{date}.md", 'r') as f:
                  content = f.read()
          except FileNotFoundError:
              content = "No report found for today."

          html_lines = []
          for line in content.split('\n'):
              if line.startswith('# '):
                  html_lines.append(f'<h2 style="color:#1a1a1a;">{line[2:]}</h2>')
              elif line.startswith('## '):
                  html_lines.append(f'<h3 style="color:#333;">{line[3:]}</h3>')
              else:
                  html_lines.append(f'<p>{line}</p>')

          html_body = '\n'.join(html_lines)
          html = f"<html><body>{html_body}</body></html>"

          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"AI Safety Digest — {date}"
          msg['From'] = gmail
          msg['To'] = gmail
          msg.attach(MIMEText(content, 'plain'))
          msg.attach(MIMEText(html, 'html'))

          if gmail and password:
              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
                  server.login(gmail, password)
                  server.sendmail(gmail, gmail, msg.as_string())
              print("Email sent successfully")
          else:
              print("Missing credentials")
          EOF
