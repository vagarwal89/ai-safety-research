name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the latest budget model for 2026 to save money
          claude_args: "--model claude-haiku-4-5"
          prompt: "Briefly execute the research tasks in CLAUDE.md. Save the summary to reports/."

      - name: Automatic Save
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily research report"
          file_pattern: 'reports/*.md'
