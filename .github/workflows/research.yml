name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 1. Use the cheaper model. 2. Stop 'Extended Thinking' to save money.
          claude_args: "--model claude-3-5-haiku"
          prompt: "Execute Daily Tasks in CLAUDE.md. Write the report to reports/daily-$(date +%F).md. Be very brief."

      - name: Automatic Save
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily research report"
          file_pattern: 'reports/*.md'
