name: Daily AI Research Bot
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Workspace
        run: |
          mkdir -p reports
          touch reports/latest_research.md

      - name: Run Claude Research
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-haiku-4-5"
          # We tell Claude exactly which file to overwrite
          prompt: "Read CLAUDE.md. Conduct the research. Write the FINAL output directly into the file 'reports/latest_research.md'. Do not just talk, you must write to the file."

      - name: Automatic Save
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily research report"
          file_pattern: 'reports/*.md'
